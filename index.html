     <div class="container-fluid p-0">

    <!-- Header Start -->
    <div class="jumbotron jumbotron-fluid page-header position-relative overlay-bottom" style="margin-bottom: 90px;">
        <div class="container text-center py-5">
            <div class="container-fluid px-0">
                <div class="row justify-content-center bg-image mx-0 mb-2" >
                    <div class="col-lg-15 py-2" id="map" >
                        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

                        <script>
                            // koordinat (contoh: Indonesia)
                            var map = L.map('map').setView([-3.690387, 128.186579], 13);

                            // tile map
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                attribution: '&copy; OpenStreetMap'
                            }).addTo(map);
                                
                            //icon
                                const cctvIcon = L.icon({
                                    iconUrl: 'img/cctv.png',
                                    iconSize: [40, 40],      // ukuran ikon
                                    iconAnchor: [20, 40],    // titik yang menempel ke koordinat
                                    popupAnchor: [0, -40]    // posisi popup
                                });

                                // marker
                                const lokasi = [
                                {
                                    nama: "CCTV Balai Kota",
                                    lat: -3.69421,
                                    lng: 128.18149,
                                    stream: "https://screens-postposted-significant-termination.trycloudflare.com/balaikota/index.m3u8?cookieCheck=1"
                                },
                                {
                                    nama: "CCTV DPRD Kota Ambon",
                                    lat: -3.69586,
                                    lng: 128.190000,
                                    stream: "https://screens-postposted-significant-termination.trycloudflare.com/dprdkota/index.m3u8?cookieCheck=1"
                                },
                                {
                                    nama: "CCTV Sungai Batu Merah",
                                    lat: -3.68687,
                                    lng: 128.18766,
                                    stream: "https://screens-postposted-significant-termination.trycloudflare.com/sungaibatumerah/index.m3u8?cookieCheck=1"
                                },
                                {
                                    nama: "CCTV Bak Sampah Tulukabessy",
                                    lat: -3.68986,
                                    lng: 128.18619,
                                    stream: "https://screens-postposted-significant-termination.trycloudflare.com/sampahtulukabessy/index.m3u8?cookieCheck=1"
                                },
                                {
                                    nama: "CCTV Taman Bawah JMP",
                                    lat: -3.66719,
                                    lng: 128.19782,
                                    stream: "https://screens-postposted-significant-termination.trycloudflare.com/tamanjmp/index.m3u8?cookieCheck=1"
                                }
                                // {
                                //     nama: "CCTV Pasar Mardika",
                                //     lat: -3.68708,
                                //     lng: 128.18405,
                                //     stream: "https://arrivals-minutes-communication-provinces.trycloudflare.com/pasar/index.m3u8?cookieCheck=1"
                                // }

                            ];

                            lokasi.forEach(function(item, index) {
                                L.marker([item.lat, item.lng], {
                                    icon: cctvIcon
                                })
                                .addTo(map)
                                .bindPopup(`
                                    <h5>${item.nama}</h5>
                                    <video id="video${index}" width="300" controls autoplay muted></video>
                                `)
                                .on('popupopen', function () {

                                const video = document.getElementById(`video${index}`);

                                if (Hls.isSupported()) {
                                    const hls = new Hls();
                                    hls.loadSource(item.stream);
                                    hls.attachMedia(video);
                                } else {
                                    video.src = item.stream;
                                }
                                });
                            });
                            // jika mau pop up langsung kebuka aktifkan yang dibawa
                            // .openPopup();
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid py-5">

                        <h1 class="display-4">Apa Manfaat CCTV untuk Masyarakat?</h1>
                    </div>
                    <p class="mb-4 pb-2">CCTV Live Streaming pada website Command Center memberikan akses 
                        informasi visual secara langsung kepada masyarakat. Fitur ini mendukung transparansi 
                        informasi, meningkatkan pemantauan kondisi wilayah, serta membantu masyarakat memperoleh 
                        informasi situasi terkini secara cepat dan mudah.</p>
                    <div class="d-flex mb-3">
                        <div class="btn-icon bg-primary mr-4">
                            <i class="fa fa-2x fa-book-reader text-white"></i>
                        </div>
                        <div class="mt-n1">
                            <h4>Informasi Real-Time</h4>
                            <p>Masyarakat dapat melihat kondisi dan situasi di lokasi yang terpantau CCTV secara langsung melalui website Command Center.</p>
                        </div>
                    </div>
                    <div class="d-flex mb-3">
                        <div class="btn-icon bg-secondary mr-4">

                        </div>

                            <p>Penyediaan akses CCTV secara publik mendukung keterbukaan informasi dan meningkatkan transparansi pemerintah kepada masyarakat.</p>
                        </div>
                    </div>
                    <div class="d-flex">
                        <div class="btn-icon bg-warning mr-4">
                            <i class="fa fa-2x fa-book-reader text-white"></i>
                        </div>
                        <div class="mt-n1">
                            <h4>Mendukung Keamanan</h4>
                            <p class="m-0">Informasi visual secara real-time dapat membantu masyarakat mengetahui kondisi lingkungan dan mendukung kewaspadaan terhadap situasi yang terjadi.</p>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5" style="min-height: 500px;">
                    <div class="position-relative h-100">

                    </div>
                </div>
